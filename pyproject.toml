[project]
name = "fhir-mock-api"
version = "0.1.0"
description = "FHIR pattern API mocked."
readme = "README.md"
authors = [
    { name = "Kaio Custodio" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
fhir-mock-api = "fhir_mock_api:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
