[project]
name = "fhir-mock-api"
version = "0.1.0"
description = "FHIR pattern API mocked."
readme = "README.md"
authors = [
    { name = "Kaio Custodio" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_pytest -p no:launch_testing_ros -v"
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]
